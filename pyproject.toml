[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "moodlectl"
version = "1.1.1"
description = "Moodle course resources CLI and Python API with browser SSO and optional REST web services"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Giovanni Ciatto", email = "giovanni.ciatto@unibo.it"}]
dependencies = [
  "playwright>=1.49,<2",
  "typer>=0.12,<1",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "beautifulsoup4>=4.12,<5",
  "rich>=13,<16",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]

[dependency-groups]
dev = [
  "coverage>=7.14.0",
  "mypy>=2.1.0",
  "poethepoet>=0.45.0",
  "pytest>=9.0.3",
  "pytest-cov>=5,<8",
  "ruff>=0.15.12",
]

[project.scripts]
moodlectl = "moodlectl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.poe.tasks]
test = "pytest"
test-live = "pytest -s tests/test_live.py"
coverage = "coverage run -m pytest"
coverage-report = "coverage report -m"
coverage-html = "coverage html"
ruff-check = "ruff check"
ruff-fix = "ruff check --fix"
format = "ruff format"
format-check = "ruff format --check"
mypy = "mypy src tests --ignore-missing-imports"
compile = "python -m compileall -q src tests"
static-checks = ["compile", "format-check", "ruff-check", "mypy"]
static-fixes = ["ruff-fix", "format"]
install-hooks = "git config core.hooksPath .githooks"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
